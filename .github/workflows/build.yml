name: Build Artifacts

permissions:
  contents: write

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: ubuntu-22.04
            name: linux

          - platform: windows-latest
            name: windows

          - platform: macos-15-intel
            name: macos-intel

          - platform: macos-14
            name: macos-arm

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt update
            sudo apt install -y build-essential libfuse2 wget git libglfw3-dev pkg-config
          else
            brew update
            brew install glfw pkg-config
          fi

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y make wget git winfsp --no-progress
          $glfw_url = "https://github.com/glfw/glfw/releases/download/3.4/glfw-3.4.bin.WIN64.zip"
          $glfw_zip = "$env:TEMP\glfw.zip"
          $glfw_dir = "$env:TEMP\glfw"
          Invoke-WebRequest -Uri $glfw_url -OutFile $glfw_zip
          Expand-Archive -Path $glfw_zip -DestinationPath $glfw_dir -Force
          echo "GLFW_DIR=$glfw_dir\glfw-3.4.bin.WIN64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile Binary (Linux)
        shell: bash
        if: runner.os == 'Linux'
        run: make

      - name: Build macOS .app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          make bundle-macos
          ARCH=$(uname -m)
          mkdir -p dist
          mv SimpliFile.app SimpliFile-$ARCH.app
          zip -r dist/SimpliFile-macos-$ARCH.zip SimpliFile-$ARCH.app

      - name: Package Binary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x SimpliFile.application
          mkdir -p appimage/usr/bin
          cp SimpliFile.application appimage/usr/bin/
          cp -r includes/ appimage/usr/bin/includes/
          chmod +x appimage/AppRun
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage appimage SimpliFile.AppImage
          mkdir -p dist
          cp SimpliFile.AppImage dist/
          zip -r dist/SimpliFile-linux.zip dist/

      - name: Package Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
            New-Item -ItemType Directory -Force -Path dist
            Copy-Item SimpliFile.exe -Destination dist/
            Copy-Item -Recurse includes dist/includes
            Compress-Archive -Path dist/* -DestinationPath dist/SimpliFile-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpliFile-${{ matrix.name }}
          path: dist/
          
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: SimpliFile-linux
          path: dist/

      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: SimpliFile-windows
          path: dist/

      - name: Download macOS Intel
        uses: actions/download-artifact@v4
        with:
          name: SimpliFile-macos-intel
          path: dist/

      - name: Download macOS ARM
        uses: actions/download-artifact@v4
        with:
          name: SimpliFile-macos-arm
          path: dist/
          
      - name: Create Tag
        id: tag
        run: |
          TAG="v1.3.1-c$(git rev-list --count HEAD)"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag $TAG
          git push origin $TAG
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/**/*.zip
          body: |
            *This is an automated build, it may not be stable*
            **Builds by platform:**
            - Windows: SimpliFile-windows.zip
            - Linux: SimpliFile-linux.zip
            - macOS (Intel based macs): SimpliFile-macos-x86_64.zip
            - macOS (Apple Silicon): SimpliFile-macos-arm64.zip
            
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

